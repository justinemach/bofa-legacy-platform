<bofa-panel heading="Payroll batch" subheading="ACH credit entries for the current cycle">
  <mat-slide-toggle class="same-day" [(ngModel)]="sameDay">
    Same-day settlement
  </mat-slide-toggle>

  <mat-list class="payees">
    <mat-list-item *ngFor="let item of items">
      <span class="payee">{{ item.payee }}</span>
      <span class="routing">ABA {{ item.routing }}</span>
      <span class="amount">{{ item.amount | bofaMoney }}</span>
    </mat-list-item>
  </mat-list>

  <p class="total">
    {{ selectedItems.length }} entries · <strong>{{ batchTotal | bofaMoney }}</strong>
  </p>

  <bofa-button variant="primary" [disabled]="submitting" (pressed)="submitBatch()">
    Submit batch
  </bofa-button>
</bofa-panel>
